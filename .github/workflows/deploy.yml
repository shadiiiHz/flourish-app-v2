name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync files to server
        uses: burnett01/rsync-deployments@7.0.2
        with:
          switches: >-
            -avzr --delete
            --exclude=.git
            --exclude=node_modules
            --exclude=server/node_modules
            --exclude=.next
            --exclude=server/dist
            --exclude=server/uploads
          path: ./
          remote_path: ${{ vars.DEPLOY_PATH || '/home/ubuntu/flourish-app-v2' }}
          remote_host: ${{ secrets.DEPLOY_HOST }}
          remote_user: ${{ secrets.DEPLOY_USER }}
          remote_key: ${{ secrets.DEPLOY_SSH_KEY }}
          remote_port: ${{ secrets.DEPLOY_PORT || 22 }}

      - name: Install, build and restart on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          script: |
            export DEPLOY_HOST="${{ secrets.DEPLOY_HOST }}"
            cd "${{ vars.DEPLOY_PATH || '/home/ubuntu/flourish-app-v2' }}"
            chmod +x deploy/deploy.sh
            bash deploy/deploy.sh
